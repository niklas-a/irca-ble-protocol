name: Validate

on:
  push:
    branches: [main]
  pull_request:
  # The integration can break without us touching it, when Home Assistant or
  # HACS change their requirements. A weekly run catches that.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest (Home Assistant manifest rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
